services:
  mongodb:
    image: mongo:7.0.5
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: cart-service
    volumes:
      - ./data/mongodb:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9004:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      CMD_ARGS: --message.format=DEFAULT --message.sendEnabled=true --server.servlet.contextPath=/

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: ecommerce
    command: server /data --console-address ":9001"
    volumes:
        - minio_data:/data

  minio-setup:
    image: quay.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Esperando a MinIO...';
      sleep 5;
      
      mc alias set myminio http://minio:9000 \minioadmin \minioadmin;
      
      mc mb myminio/ecommerce --ignore-existing;
      
      mc anonymous set download myminio/ecommerce;
      
      mc ilm add --expire-days 1 myminio/ecommerce --prefix 'temp/';
      
      echo '¡Setup de infraestructura finalizado exitosamente!';
      exit 0;
      "

volumes:
  minio_data: